<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1">
        <animate attributeName="stop-color" values="#ff6b6b;#feca57;#48dbfb;#ff9ff3;#ff6b6b" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#feca57;stop-opacity:1">
        <animate attributeName="stop-color" values="#feca57;#48dbfb;#ff9ff3;#ff6b6b;#feca57" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#48dbfb;stop-opacity:1">
        <animate attributeName="stop-color" values="#48dbfb;#ff9ff3;#ff6b6b;#feca57;#48dbfb" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48dbfb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff9ff3;stop-opacity:1"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#0a0a0a"/>
  
  <!-- Animated shield -->
  <g transform="translate(100, 100)">
    <path d="M0,-60 L50,-30 L50,30 L0,60 L-50,30 L-50,-30 Z" 
          fill="none" 
          stroke="url(#grad1)" 
          stroke-width="3"
          filter="url(#glow)">
      <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Inner shield -->
    <path d="M0,-40 L33,-20 L33,20 L0,40 L-33,20 L-33,-20 Z" 
          fill="url(#grad1)" 
          opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Check mark -->
    <path d="M-15,0 L-5,10 L15,-10" 
          fill="none" 
          stroke="#fff" 
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,100;50,100;0,100" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Text -->
  <text x="200" y="80" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold"
        fill="url(#grad1)"
        filter="url(#glow)">
    Universal Anti-Slop
    <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <text x="200" y="130" 
        font-family="Arial, sans-serif" 
        font-size="24"
        fill="#888">
    Kill AI Slop Forever
    <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
  </text>
  
  <!-- Floating particles -->
  <circle cx="50" cy="50" r="2" fill="#ff6b6b" opacity="0.6">
    <animate attributeName="cy" values="50;30;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="700" cy="80" r="3" fill="#48dbfb" opacity="0.5">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="650" cy="150" r="2" fill="#feca57" opacity="0.7">
    <animate attributeName="cy" values="150;130;150" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="150" cy="170" r="2" fill="#ff9ff3" opacity="0.6">
    <animate attributeName="cy" values="170;150;170" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
